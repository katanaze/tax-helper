<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tax Return Helper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <span class="brand-mark">৳</span>
        <span>Tax Return Helper<small>for etaxnbr.gov.bd</small></span>
      </div>
      <div class="year-controls">
        <label class="ctl" title="Whose return. Add someone else, e.g. your spouse, from this list.">
          <span>Person</span><select id="personSelect"></select>
        </label>
        <label class="ctl" title="Assessment year. Start the next year from this list.">
          <span>Year</span><select id="yearSelect"></select>
        </label>
        <span id="yearRole" class="year-pill"></span>
        <span id="saveStatus" class="save-status"></span>
      </div>
    </div>
  </header>
  <div class="shell">
    <nav id="steps" class="side" aria-label="Steps"></nav>
    <main id="main"><p class="muted">Loading…</p></main>
  </div>
  <script src="app.js"></script>
</body>
</html>
